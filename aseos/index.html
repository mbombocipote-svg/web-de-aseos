<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonRest // Buscador de Aseos Urbanos</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="control-panel">
            <header class="app-header">
                <h1>NEON<span class="highlight">REST</span></h1>
                <p class="subtitle">S.O.S. Localizador de Aseos</p>
            </header>

            <section class="controls">
                <div class="control-group">
                    <label for="range-slider">Radio de Búsqueda: <span id="range-value">1.0</span> km</label>
                    <input type="range" id="range-slider" min="0.5" max="5" step="0.1" value="1.0">
                </div>

                <button id="btn-select-center" class="btn-neon">
                    <i class="fa-solid fa-crosshairs"></i> Seleccionar Centro de Búsqueda
                </button>
                <p id="mode-indicator" class="mode-indicator">Modo Selección Activo: Haz click en el mapa</p>
            </section>

            <section class="results-container">
                <h2>Aseos Detectados (<span id="results-count">0</span>)</h2>
                <div id="results-list" class="results-list">
                    </div>
            </section>
        </aside>

        <main id="map" class="map-container"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
