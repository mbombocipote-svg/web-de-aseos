<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonRest - Buscador Cyberpunk</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="control-panel">
            <div class="app-header">
                <h1>NEON<span class="highlight">REST</span></h1>
                <div class="subtitle">Escáner de Aseos Urbanos</div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label for="range-slider">Radio de Escaneo: <span id="range-value" class="highlight">1.0</span> km</label>
                    <input type="range" id="range-slider" min="0.5" max="5" step="0.5" value="1.0">
                </div>
                
                <button id="btn-select-center" class="btn-neon">Fijar Centro Manual</button>
                <div id="mode-indicator" class="mode-indicator"></div>
            </div>

            <div class="results-container">
                <h2>Resultados (<span id="results-count" class="highlight">0</span>)</h2>
                <div id="results-list" class="results-list">
                    </div>
            </div>
        </div>

        <div id="map" class="map-container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
